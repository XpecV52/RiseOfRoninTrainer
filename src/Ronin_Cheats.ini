; ============================================================
;  Ronin_Cheats.ini  —  Rise of the Ronin built-in trainer
;  浪人崛起 内置修改 / Rise of the Ronin built-in trainer
;
;  放在游戏根目录（和 dinput8.dll 同目录），改完保存后重启游戏生效。
;  Put next to dinput8.dll in the game folder. Restart the game after editing.
;
;  1 = 开 / on        0 = 关 / off
; ============================================================
[Ronin]

; ---------- 自动石火 / Auto parry ----------
; 1 = 开 / on        0 = 关 / off
enable_auto_parry=1

; ---------- 无视套装件数需求 / Ignore set piece requirement ----------
; 1 = 开 / on        0 = 关 / off
enable_no_set_req=1

; ---------- 物品不减 / Infinite items ----------
; 1 = 物品不减 / items never decrease
; 0 = 正常消耗 / normal consumption
enable_inf_item=1
