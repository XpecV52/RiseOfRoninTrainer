; ============================================================
;  Ronin_Cheats.ini — 浪人崛起 内置修改
;  和 dinput8.dll 放在游戏根目录，改完保存，重启游戏生效。
; ============================================================
[Ronin]

; ---------- 功能开关 ----------
enable_inf_item=1         ; 无限物品使用
enable_hooks=1            ; 全部 hook 功能（石火 / buff / 角色状态 / 气焰 等）
max_hooks=0               ; 0 = 全开；填正数则只装前 N 条（排查用）

; ---------- 调试 ----------
log_verbose=0             ; 0 = 不写日志；改成 1 会在游戏目录生成 Ronin_Cheats.log
