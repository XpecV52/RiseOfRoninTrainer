; ============================================================
;  Ronin_Cheats.ini  —  Rise of the Ronin built-in trainer
;  浪人崛起 内置修改 / Rise of the Ronin built-in trainer
;
;  放在游戏根目录（和 dinput8.dll 同目录），改完保存后重启游戏生效。
;  Put next to dinput8.dll in the game folder. Restart the game after editing.
;
;  1 = 开 / on        0 = 关 / off
; ============================================================
[Ronin]

; ---------- 无限物品使用 / Infinite Items ----------
; 1 = 物品不减 / items never decrease
; 0 = 正常消耗 / normal consumption
enable_inf_item=1

; ---------- 其余所有功能的总开关 / Master switch for all other features ----------
; 1 = 全开 / all on        0 = 全关 / all off
; 包含 / includes:
;   增加石火时机 / Longer parry window
;   自动石火 / Auto parry
;   所有流派石火有利效果 / All style parry bonus effects
;   增减益(buff)控制 / Buff control
;   角色状态值 / Character stats
;   气焰 / Ki
;   精力消耗（体力不消耗）/ Ki (stamina) consumption
;   无视套装件数需求 / Ignore set piece requirement
enable_hooks=1

; ---------- 只装前 N 条 hook / Install only the first N hooks ----------
; 0 = 全部安装（17 条）/ install all (17)
; N = 只装前 N 条，用于排查崩溃 / install first N only, for crash debugging
;
; 注意：这一行不要删 / Do NOT delete this line
;   删掉后程序按 1 处理，只会装 1 条 hook
;   if deleted, the code falls back to 1 and installs only one hook
max_hooks=0
