; ============================================================
;  Ronin_Cheats.ini  —  浪人崛起 内置修改
;  放在游戏根目录（和 dinput8.dll 同目录），改完保存后重启游戏生效。
;  1 = 开    0 = 关
; ============================================================
[Ronin]

; ---------- 无限物品使用（可单独开关）----------
; 1 = 物品不减    0 = 正常消耗
enable_inf_item=1

; ---------- 其余所有功能的总开关（只能全开或全关）----------
; 1 = 全开    0 = 全关
; 包含：增加石火时机 / 自动石火 / 所有流派石火有利效果 / 增减益(buff)控制
;       角色状态值 / 气焰 / 精力消耗（体力不消耗） / 无视套装件数需求
enable_hooks=1

; ---------- 只装前 N 条 hook（排查崩溃用，正常保持 0）----------
; 0  = 全部安装（17 条）
; N  = 只装前 N 条，用来二分定位是哪条 hook 导致崩溃
; 注意：这一行不要删，删掉后程序按 1 处理，只会装 1 条 hook
max_hooks=0

; ---------- 日志 ----------
; 0 = 不写日志（正常游玩保持 0）
; 1 = 在游戏根目录生成 Ronin_Cheats.log，记录每条 hook 的安装结果
log_verbose=0
